<style>

  --up:#ff6b5f; --up-soft:#3a1f1d; --down:#3fc285; --down-soft:#173326; --warn:#e5ac4c; --warn-soft:#3a2f19;
  --seg1:#6fb6b2; --seg2:#3f7b77; --seg3:#b39c62; --seg4:#55625f; --seg5:#a58bb8; --seg6:#d98c5f; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121716; --panel:#1a2120; --panel-2:#202927; --line:#2f3a38; --ink:#e6ebe9; --ink-2:#a9b4b1; --ink-3:#77837f;
  --accent:#6fb6b2; --accent-soft:#1f3433; --brass:#d3a656;
  --up:#ff6b5f; --up-soft:#3a1f1d; --down:#3fc285; --down-soft:#173326; --warn:#e5ac4c; --warn-soft:#3a2f19;

*{box-sizing:border-box}

.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--ink-3)}
.etfcard{display:flex;flex-direction:column;gap:12px}
.etfhead{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.code{font-family:var(--f-num);font-weight:500;font-size:13px;color:var(--accent);letter-spacing:.04em}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:1px 8px;border-radius:999px;white-space:nowrap;border:1px solid transparent}
.pill.ok{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--up-soft);color:var(--up)}

.st{font-size:12px;padding:1px 7px;border-radius:4px;white-space:nowrap}
.st.新增,.st.加碼{background:var(--up-soft);color:var(--up)}
.st.剔除,.st.減碼{background:var(--down-soft);color:var(--down)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{position:sticky;top:0;background:var(--panel-2);font-weight:500;color:var(--ink-2);font-size:12px;cursor:pointer;user-select:none}
th.r,td.r{text-align:right}
tbody tr:hover td{background:var(--panel-2)}
tbody tr:last-child td{border-bottom:0}
td.name{white-space:normal;min-width:120px}
.sel{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;border:1px solid var(--line);background:var(--panel);color:var(--ink-2);border-radius:999px;padding:4px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
input[type=search],input[type=text],input[type=number],input[type=password],select{font:inherit;font-size:13px;padding:6px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);min-width:0}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chartbox{position:relative;height:260px}
.chartbox.sm{height:200px}
.hbars{display:flex;flex-direction:column;gap:6px}
.hb{display:grid;grid-template-columns:minmax(80px,140px) 1fr 76px;gap:8px;align-items:center;font-size:12.5px}
.hb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .track{height:10px;background:var(--panel-2);border-radius:2px;position:relative}
.hb .fill{position:absolute;top:0;bottom:0;border-radius:2px;background:var(--seg2)}
.hb .val{text-align:right;font-family:var(--f-num);font-variant-numeric:tabular-nums}
.div .track::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:1px;background:var(--ink-3)}
.alert{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;padding:10px 12px;border-left:3px solid var(--line);background:var(--panel-2);border-radius:4px}
.alert.高{border-left-color:var(--up)} .alert.中{border-left-color:var(--warn)} .alert.低{border-left-color:var(--ink-3)}
.alert .meta{font-size:12px;color:var(--ink-2)}
.list{display:flex;flex-direction:column;gap:8px}
.empty{padding:20px;text-align:center;color:var(--ink-2);background:var(--panel-2);border-radius:6px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--panel-2);border-radius:6px;padding:10px 12px}
.note b{color:var(--ink)}
.gauge{height:8px;background:var(--panel-2);border-radius:4px;position:relative;margin-top:6px}
.gauge .g{position:absolute;top:0;bottom:0;left:0;border-radius:4px;background:var(--accent)}
.gauge .lim{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);padding:0;width:min(520px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.35)}
.dlg{padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spark{width:120px;height:28px}
.prose{max-width:72ch}
.prose h3{color:var(--ink);font-size:14px;margin:18px 0 6px}
.prose p,.prose li{color:var(--ink-2)}
.demo-banner{background:var(--warn-soft);color:var(--warn);font-size:12.5px;padding:6px 0}
@media (max-width:640px){.chartbox{height:220px}.brand h1{font-size:18px}.hb{grid-template-columns:90px 1fr 64px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<header class="top">
  <div id="demoBanner" class="demo-banner" hidden><div class="wrap">示範資料：持股為 2026-10-28 晚間從三家投信網站實際擷取，股價為當晚 Yahoo Finance 報價。部署到 GitHub 後每天 09:00 自動更新。</div></div>
  <div class="wrap">
    <div class="bar">
      <div class="brand"><h1>主動 ETF 持股雷達</h1><small id="subtitle">追蹤經理人每天的持股、現金與期貨部位</small></div>
      <div class="stamp"><span>資料更新 <b id="genAt" class="mono">—</b></span><span id="nextRun" class="muted"></span></div>
      <button class="btn primary" id="updBtn" type="button" aria-haspopup="dialog">一鍵更新</button>
      <button class="tip" type="button" data-tip="一鍵更新：觸發 GitHub 上的更新程序。選「只更新股價」約 1–2 分鐘，「完整更新」會重新抓三家投信的持股，約 3–5 分鐘。持股一天只公布一次，盤中按完整更新不會有新持股。第一次使用要在設定裡貼上 GitHub 權杖。">i</button>
    </div>
    <nav class="tabs" role="tablist" id="tabs"></nav>
  </div>
</header>

  <form class="dlg" method="dialog" id="updForm">

<script>
"use strict";
// ---------------------------------------------------------------- state & helpers
const S={meta:null,etf:{},stocks:null,agg:null,rules:null,alerts:null,health:null,reports:null,bt:null,market:null,
  curEtf:null,charts:[],sort:{},showTiny:false};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmt={
  n(x,d=0){return x==null||isNaN(x)?"—":Number(x).toLocaleString("zh-TW",{minimumFractionDigits:d,maximumFractionDigits:d})},
  p(x,d=2){return x==null||isNaN(x)?"—":Number(x).toFixed(d)+"%"},
  pp(x,d=2){return x==null||isNaN(x)?"—":(x>0?"+":"")+Number(x).toFixed(d)},
  yi(x,d=2){if(x==null||isNaN(x))return"—";const a=Math.abs(x);if(a>=1e8)return(x/1e8).toFixed(d)+" 億";if(a>=1e4)return(x/1e4).toFixed(0)+" 萬";return fmt.n(x)},
  syi(x,d=2){return x==null||isNaN(x)?"—":(x>0?"+":x<0?"−":"")+fmt.yi(Math.abs(x),d)},
  px(x){if(x==null)return"—";const a=Math.abs(x);return fmt.n(x,a>=1000?0:a>=100?1:2)},
  qty(h){if(h.shares==null)return"—";return h.market==="TW"?fmt.n(h.shares/1000,h.shares%1000?3:0)+" 張":fmt.n(h.shares)+" 股"},
  qtyRaw(sh,m){if(sh==null)return"—";return m==="台灣"||m==="TW"?fmt.n(sh/1000,sh%1000?3:0)+" 張":fmt.n(sh)+" 股"},
  d(s){return s?String(s).slice(0,10):"—"},
  t(s){return s?String(s).replace("T"," ").slice(0,16):"—"},
};
const cls=x=>x>0?"up":x<0?"down":"muted";
const tip=t=>`<button class="tip" type="button" data-tip="${esc(t)}" aria-label="說明">i</button>`;

// Feature descriptions (shown in the ⓘ tooltips)
const TIPS={
  overview:"總覽：每檔 ETF 最新一天的規模、資產配置與異動摘要。先看這裡判斷今天哪一檔有大動作。",
  aggSum:"全部追蹤 ETF 合計：以規模加權的現金及其他比例與有效股票曝險，是用經理人部位判斷多空氣氛的核心指標。",
  stack:"資產配置條：股票、附買回債券、現金、期貨保證金、應收付等占淨值的比例。安聯只揭露股票與附買回，其餘以差額推算。",
  cash:"現金及其他 = 100% − 股票% − 債券%，包含現金、附買回債券、期貨保證金、應收付款。比例上升可能是經理人轉保守，也可能只是新申購資金還沒買完，請搭配「申購贖回」一起看。",
  eff:"有效股票曝險 = 股票% ＋ 期貨多單名目% − 期貨空單名目%。經理人常用台指期貨快速調整曝險，這個數字比單看股票%更接近真實部位。",
  fut:"期貨名目本金占淨值比例（不是資產，是曝險）。例如 00981A 持有台指期多單時，有效曝險會高於股票%。",
  flows:"申購贖回：用流通單位數的變化 × 每單位淨值估算淨申購金額。正值代表有新資金流入，經理人被動需要買股。",
  active:"主動調整：剔除申購贖回造成的等比例增減後，經理人真正加碼或減碼的股數與金額（金額以持股日收盤價估算）。",
  holdings:"持股明細：股數、權重、持股日收盤價、目前股價與市值。台股以「張」顯示（1 張 = 1,000 股），外國股票以「股」顯示並換算台幣。",
  cost:"推算平均成本：投信不公布成本。這裡用每天增加的股數 × 當天典型價（(最高+最低+收盤)/3）累積，減碼時按比例扣除。追蹤第一天的部位以當天價格作為起始基準，所以只代表「追蹤期間」的成本，不是基金真實成本。",
  rules:"公開說明書規則：每檔 ETF 的投資比例限制（股票下限、單一個股上限、地區規定等），並用最新持股自動檢查是否符合。標示「近似」的項目只能用掛牌市場推估。",
  changes:"持股變化：比較兩個持股日，列出新增、剔除、加碼、減碼。狀態以剔除申購贖回後的「主動調整」判定。",
  stocks:"個股查詢：輸入代號或名稱，看哪些追蹤中的 ETF 持有它、持有多少、最近一次是加碼還是減碼。",
  crowd:"擁擠持股：同時被兩檔以上追蹤 ETF 持有的股票。被越多經理人同時持有，賣壓出現時越容易一起出場。",
  theme:"主題淨買超：把每檔 ETF 的主動調整金額按產業主題加總。紅色代表經理人淨加碼，綠色代表淨減碼。主題分類可在 config/themes.json 修改。",
  breadth:"買賣廣度：(加碼＋新增 − 減碼 − 剔除) ÷ 總異動筆數。+100 代表全部都在買，−100 代表全部都在賣。",
  consensus:"共識買賣：同一天有兩檔以上 ETF 同方向調整的股票。",

// ---------------------------------------------------------------- data loading
async function j(path){const r=await fetch(path+"?v="+Date.now());if(!r.ok)throw new Error(path+" "+r.status);return r.json()}
async function loadAll(){
  S.meta=await j("data/meta.json");
  const codes=S.meta.etfs.map(e=>e.code);
  const res=await Promise.allSettled(codes.map(c=>j(`data/etf_${c}.json`)));
  res.forEach((r,i)=>{if(r.status==="fulfilled")S.etf[codes[i]]=r.value});
  const names=["stocks","aggregate","rules","alerts","health","reports","backtest","market"];
  const keys=["stocks","agg","rules","alerts","health","reports","bt","market"];
  const more=await Promise.allSettled(names.map(n=>j(`data/${n}.json`)));
  more.forEach((r,i)=>{S[keys[i]]=r.status==="fulfilled"?r.value:null});
  if(!S.curEtf)S.curEtf=store.get("curEtf",codes.find(c=>S.etf[c])||codes[0]);
  if(!S.etf[S.curEtf])S.curEtf=codes.find(c=>S.etf[c]);
  $("#genAt").textContent=fmt.t(S.meta.generated_at);
  $("#demoBanner").hidden=!S.meta.demo;
  $("#nextRun").textContent="排程：週一至週五 09:00";
}

// ---------------------------------------------------------------- routing
const VIEWS=[["overview","總覽"],["etf","ETF 明細"],["changes","持股變化"],["stocks","個股查詢"],["aggregate","跨基金彙總"],
  ["rules","規則檢查"],["alerts","提醒"],["mine","我的持股"],["reports","週報月報"],["health","資料健康"],["backtest","訊號回測"],["guide","說明"]];
function renderTabs(cur){
  $("#tabs").innerHTML=VIEWS.map(([id,l])=>`<button class="tab" role="tab" type="button" data-v="${id}" aria-selected="${id===cur}">${l}${id==="alerts"&&S.alerts?` <span class="pill ${S.alerts.current.some(a=>a.level==="高")?"bad":"na"}" style="padding:0 6px">${S.alerts.current.length}</span>`:""}</button>`).join("");
}
function route(){
  const v=(location.hash||"#overview").slice(1);
  const cur=VIEWS.some(x=>x[0]===v)?v:"overview";
  renderTabs(cur);
  S.charts.forEach(c=>c.destroy());S.charts=[];
  const el=$("#view");
  try{el.innerHTML=R[cur]();(A[cur]||(()=>{}))()}catch(e){console.error(e);el.innerHTML=`<div class="empty">這個分頁載入失敗：${esc(e.message)}</div>`}
  window.scrollTo({top:0});
}
document.addEventListener("click",e=>{
  const t=e.target.closest(".tab");if(t){location.hash=t.dataset.v;return}
  const c=e.target.closest("[data-etf]");if(c){e.preventDefault();S.curEtf=c.dataset.etf;store.set("curEtf",S.curEtf);if(c.dataset.go&&location.hash!=="#"+c.dataset.go)location.hash=c.dataset.go;else route();return}
  const s=e.target.closest("[data-stock]");if(s){e.preventDefault();S.stockKey=s.dataset.stock;if(location.hash!=="#stocks")location.hash="stocks";else route();return}
  const th=e.target.closest("th[data-k]");if(th){const id=th.closest("table").id;const o=S.sort[id]||{};S.sort[id]={k:th.dataset.k,dir:o.k===th.dataset.k?-o.dir:-1};route();return}
});

const tipbox=$("#tipbox");
function showTip(b){tipbox.textContent=b.dataset.tip;tipbox.hidden=false;const r=b.getBoundingClientRect();const w=tipbox.offsetWidth,h=tipbox.offsetHeight;
  let x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8);let y=r.bottom+8;if(y+h>innerHeight-8)y=r.top-h-8;tipbox.style.left=x+"px";tipbox.style.top=y+"px"}
document.addEventListener("mouseover",e=>{const b=e.target.closest(".tip");if(b)showTip(b)});
document.addEventListener("mouseout",e=>{if(e.target.closest(".tip"))tipbox.hidden=true});
document.addEventListener("focusin",e=>{const b=e.target.closest(".tip");if(b)showTip(b)});
document.addEventListener("focusout",e=>{if(e.target.closest(".tip"))tipbox.hidden=true});
document.addEventListener("click",e=>{const b=e.target.closest(".tip");if(b){e.stopPropagation();tipbox.hidden?showTip(b):tipbox.hidden=true}else if(!tipbox.hidden)tipbox.hidden=true},true);

// ---------------------------------------------------------------- shared components
const SEG={"股票":"--seg1","附買回債券":"--seg2","現金":"--seg3","現金及其他（推算）":"--seg3","期貨保證金":"--seg5","應收付證券款":"--seg4","應付贖回款":"--seg6","債券":"--seg5","其他":"--seg4","未分項差額":"--seg4"};
function stackBar(bd){
  const pos=Object.entries(bd||{}).filter(([k,v])=>v>0);
  const neg=Object.entries(bd||{}).filter(([k,v])=>v<0);
  return `<div class="stack" role="img" aria-label="資產配置">${pos.map(([k,v])=>`<span style="width:${Math.min(100,v)}%;background:var(${SEG[k]||"--seg4"})" title="${esc(k)} ${v.toFixed(2)}%"></span>`).join("")}</div>
  <div class="legend">${pos.map(([k,v])=>`<span><i style="background:var(${SEG[k]||"--seg4"})"></i>${esc(k)} <span class="mono">${v.toFixed(2)}%</span></span>`).join("")}${neg.map(([k,v])=>`<span class="muted">${esc(k)} <span class="mono">${v.toFixed(2)}%</span></span>`).join("")}</div>`;
}
function hbars(obj,{diverging=false,unit="%",max=null,limit=12,yi=false}={}){
  const ent=Object.entries(obj||{}).filter(([k,v])=>v!=null&&v!==0).slice(0,limit);
  if(!ent.length)return `<div class="empty">沒有資料</div>`;
  const m=max||Math.max(...ent.map(([k,v])=>Math.abs(v)))||1;
  return `<div class="hbars ${diverging?"div":""}">${ent.map(([k,v])=>{
    const w=Math.abs(v)/m*(diverging?50:100);
    const left=diverging?(v>=0?50:50-w):0;
    const col=diverging?(v>=0?"var(--up)":"var(--down)"):"var(--seg2)";
    return `<div class="hb"><span class="t" title="${esc(k)}">${esc(k)}</span><span class="track"><span class="fill" style="left:${left}%;width:${w}%;background:${col}"></span></span><span class="val ${diverging?cls(v):""}">${yi?fmt.syi(v):fmt.n(v,2)+unit}</span></div>`}).join("")}</div>`;
}
function sortRows(id,rows,def){
  const o=S.sort[id]||def;if(!o)return rows;
  return [...rows].sort((a,b)=>{const x=a[o.k],y=b[o.k];if(x==null)return 1;if(y==null)return -1;return (x>y?1:x<y?-1:0)*o.dir});
}
function thead(id,cols){const o=S.sort[id]||{};return `<thead><tr>${cols.map(([k,l,r])=>`<th data-k="${k}" class="${r?"r":""}" scope="col">${l}${o.k===k?(o.dir>0?" ▲":" ▼"):""}</th>`).join("")}</tr></thead>`}
function etfChips(go){return `<div class="sel" role="group" aria-label="選擇 ETF">${S.meta.etfs.map(e=>`<button type="button" class="chip" data-etf="${e.code}" ${go?`data-go="${go}"`:""} aria-pressed="${e.code===S.curEtf}">${e.code} ${esc(e.name.replace("主動",""))}</button>`).join("")}</div>`}
function chart(id,cfg){const el=document.getElementById(id);if(!el||!window.Chart)return;const ink=css("--ink-2"),line=css("--line");
  Chart.defaults.font.family=css("--f-body");Chart.defaults.color=ink;
  cfg.options=Object.assign({responsive:true,maintainAspectRatio:false,interaction:{mode:"index",intersect:false},
    plugins:{legend:{labels:{boxWidth:10,boxHeight:10}}},scales:{}},cfg.options||{});
  for(const s of Object.values(cfg.options.scales)){s.grid=Object.assign({color:line},s.grid||{});s.ticks=Object.assign({color:ink},s.ticks||{})}
  S.charts.push(new Chart(el,cfg))}
function ruleSummary(code){const r=S.rules&&S.rules[code];if(!r||!r.checks.length)return `<span class="pill na">規則未建立</span>`;
  const bad=r.checks.filter(c=>c.status==="未達"||c.status==="超過").length, warn=r.checks.filter(c=>c.status==="接近邊界").length;
  return bad?`<span class="pill bad">${bad} 項未符合</span>`:warn?`<span class="pill warn">${warn} 項接近邊界</span>`:`<span class="pill ok">規則皆符合</span>`}
function lastChange(code){const c=S.etf[code]&&S.etf[code].changes[0];return c&&c.prev_date?c:null}

function spark(hist){if(!hist||hist.length<2)return "";const v=hist.map(h=>h[1]);const mx=Math.max(...v)||1;const w=120,h=28;
  const pts=v.map((x,i)=>`${(i/(v.length-1)*(w-4)+2).toFixed(1)},${(h-3-(x/mx)*(h-6)).toFixed(1)}`).join(" ");
  const last=pts.split(" ").pop().split(",");
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" role="img" aria-label="股數走勢"><polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.5"/><circle cx="${last[0]}" cy="${last[1]}" r="2.5" fill="var(--accent)"/></svg>`}
function stockDetail(s){

      <td>${h.last_status?`<span class="st ${h.last_status}">${h.last_status}</span>`:"<span class='muted'>首次追蹤</span>"}</td><td class="r num">${fmt.px(h.avg_cost_local)} <span class="muted" style="font-size:11px">推算</span></td><td class="mono">${fmt.d(h.first_date)}</td><td>${spark(h.history)}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">目前沒有追蹤中的 ETF 持有</div>`}

  ${S.meta.etfs.map(e=>{const r=S.rules&&S.rules[e.code];if(!r)return "";
    return `<section class="panel"><div class="ph"><div><div class="code">${e.code}</div><h2>${esc(r.name||e.name)}</h2><div class="sub">上市日 ${esc(r.listing_date||"—")}・績效指標 ${esc(r.benchmark||"—")}</div></div>${ruleSummary(e.code)}</div>
      <div class="grid g3">${r.checks.map(c=>{const st=c.status==="符合"?"ok":c.status==="接近邊界"?"warn":(c.status==="未達"||c.status==="超過")?"bad":"na";
        const pctv=c.value==null?0:Math.min(100,c.value);
        return `<div class="kpi" style="gap:6px"><span class="k" style="display:block">${esc(c.label)}</span>
          <div class="row" style="justify-content:space-between"><span class="v">${c.value==null?"—":fmt.n(c.value,2)+"%"}</span><span class="pill ${st}">${esc(c.status)}</span></div>
          ${c.value!=null?`<div class="gauge"><span class="g" style="width:${pctv}%;background:var(${st==="bad"?"--up":st==="warn"?"--warn":"--accent"})"></span><span class="lim" style="left:${c.limit}%" title="限制 ${c.limit}%"></span></div><span class="sub">限制 ${c.op==="<="?"≤":"≥"} ${c.limit}%${c.margin!=null?`，距離 ${fmt.n(Math.abs(c.margin),2)} 個百分點`:""}</span>`:""}
          ${c.note?`<span class="sub">${esc(c.note)}</span>`:""}</div>`}).join("")}</div>

function findStock(code){if(!S.stocks)return null;const c=code.trim().toUpperCase().replace(/\s+/g," ");
  const cand=[c,"TW:"+c,"US:"+c.replace(/ US$/,""),"JP:"+c.replace(/ JP$/,""),"KR:"+c.replace(/ KS$/,"")];
  for(const k of cand)if(S.stocks[k])return S.stocks[k];return Object.values(S.stocks).find(s=>s.name===code.trim())||null}
function lookThrough(my){
  const agg={};let total=0,cash=0;
  for(const x of my){const code=x.code.trim().toUpperCase();const e=S.etf[code];
    if(e){const val=x.qty*(e.latest.metrics.nav_per_unit||0);total+=val;cash+=val*(e.latest.metrics.cash_other_pct||0)/100;
      for(const h of e.latest.holdings){const r=agg[h.key]||(agg[h.key]={key:h.key,name:h.name,theme:h.theme,twd:0,src:[]});r.twd+=val*(h.weight||0)/100;if(!r.src.includes(code))r.src.push(code)}}
    else{const s=findStock(code);if(s&&s.latest!=null){
      const any=Object.values(S.etf).flatMap(e=>e.latest.holdings).find(h=>h.key===s.key);const rate=s.currency==="TWD"?1:(any&&any.fx_latest)||null;
      if(rate){const val=x.qty*s.latest*rate;total+=val;const r=agg[s.key]||(agg[s.key]={key:s.key,name:s.name,theme:s.theme,twd:0,src:[]});r.twd+=val;r.src.push("直接持有")}}}}
  return {rows:Object.values(agg).sort((a,b)=>b.twd-a.twd),total,cash};
}

R.guide=()=>`<section class="panel prose"><h2>說明 ${tip(TIPS.guide)}</h2>
  <h3>資料來源與更新時間</h3>
  <p>持股直接取自各投信官網的公開資料：安聯（etf.allianzgi.com.tw，申購買回清單）、統一（ezmoney.com.tw，每日約 16:40 公布）、群益（capitalfund.com.tw，申購買回清單）。股價與匯率來自 Yahoo Finance 公開報價（開源套件 yfinance 使用的同一個來源）。每週一至週五台北時間 09:00 由 GitHub Actions 自動更新，12:00 再補抓一次。GitHub 的排程偶爾會延遲 10–30 分鐘。</p>
  <h3>持股日與申購買回清單</h3>
  <p>安聯與群益公布的是「次一營業日的申購買回清單」，代表前一個交易日收盤後的部位，這裡把它記在前一個交易日。統一公布的是當天收盤後的部位。</p>
  <h3>顏色</h3><p>依台股習慣，紅色代表上漲或買進，綠色代表下跌或賣出。</p>
  <h3>名詞</h3>
  <ul><li><b>現金及其他</b>：${esc(TIPS.cash)}</li><li><b>有效股票曝險</b>：${esc(TIPS.eff)}</li><li><b>主動調整</b>：${esc(TIPS.active)}</li><li><b>推算平均成本</b>：${esc(TIPS.cost)}</li><li><b>買賣廣度</b>：${esc(TIPS.breadth)}</li></ul>
  <h3>新增追蹤的 ETF</h3>
  <p>安聯、統一、群益旗下的 ETF：編輯儲存庫的 <code>config/etfs.json</code>，複製一筆並改代號與參數（代號對照在 <code>config/registry.json</code>，例如 00993A 安聯 E0002、00403A 統一 63YTW、00992A 群益 500）。其他投信的網站格式不同，需要新增一個抓取程式。公開說明書規則在 <code>config/rules.json</code>，主題分類在 <code>config/themes.json</code>。</p>
  <h3>設定一鍵更新</h3>
  <ol><li>GitHub 右上角頭像 → Settings → Developer settings → Personal access tokens → Fine-grained tokens → Generate new token。</li>
  <li>Repository access 只選這個儲存庫；Permissions 的 Actions 設為 Read and write，其他不用給。</li>
  <li>複製權杖，在這個頁面按「一鍵更新」→「GitHub 設定」貼上。權杖只存在這台裝置的瀏覽器。</li></ol>
  <h3>推播提醒（選用）</h3>
  <p>在儲存庫 Settings → Secrets and variables → Actions 新增：Email 用 SMTP_HOST、SMTP_PORT、SMTP_USER、SMTP_PASS、ALERT_EMAIL_TO（Gmail 需使用應用程式密碼）；LINE 用 LINE_CHANNEL_TOKEN、LINE_USER_ID（LINE Messaging API）。沒設定就不推播。</p>
  <h3>限制</h3>
  <p>投信不公布成本，均價一律為推算。安聯只揭露股票與附買回，現金以差額推算。主動 ETF 歷史短，現金比例與行情的關係需要累積資料後再判斷。本工具不構成投資建議。</p>
</section>`;

// ---------------------------------------------------------------- one-click update (GitHub Actions)
function guessRepo(){const m=location.hostname.match(/^([^.]+)\.github\.io$/);if(m){const p=location.pathname.split("/").filter(Boolean)[0];return p?`${m[1]}/${p}`:`${m[1]}/${m[1]}.github.io`}return (S.meta&&S.meta.repo)||""}
function setStatus(html){const s=$("#updStatus");s.hidden=!html;s.innerHTML=html||""}
$("#updBtn").addEventListener("click",()=>{const repo=store.get("ghRepo","")||guessRepo();$("#ghRepo").value=repo;$("#ghToken").value=store.get("ghToken","");
  $("#actionsLink").href=repo?`https://github.com/${repo}/actions/workflows/daily.yml`:"https://github.com";
  $("#ghSettings").open=!store.get("ghToken","");setStatus("");$("#updDlg").showModal()});
$("#runBtn").addEventListener("click",async()=>{
  const repo=$("#ghRepo").value.trim(),tok=$("#ghToken").value.trim();store.set("ghRepo",repo);store.set("ghToken",tok);
  $("#actionsLink").href=repo?`https://github.com/${repo}/actions/workflows/daily.yml`:"#";
  if(!repo||!tok){setStatus("請先在「GitHub 設定」填入儲存庫與權杖，或按「到 GitHub 手動執行」。");$("#ghSettings").open=true;return}
  const mode=$("#modeFull").checked?"full":"prices";const H={Authorization:`Bearer ${tok}`,Accept:"application/vnd.github+json"};
  const before=S.meta.generated_at;
  try{
    setStatus("送出更新要求…");
    const r=await fetch(`https://api.github.com/repos/${repo}/actions/workflows/daily.yml/dispatches`,{method:"POST",headers:H,body:JSON.stringify({ref:"main",inputs:{mode}})});
    if(r.status!==204)throw new Error(r.status===404?"找不到儲存庫或權杖沒有 Actions 權限":r.status===401?"權杖無效或已過期":`GitHub 回應 ${r.status}`);
    setStatus(`已開始${mode==="full"?"完整":"股價"}更新，正在等待 GitHub 執行完成（通常 2–5 分鐘）…`);
    const t0=Date.now();
    while(Date.now()-t0<15*60e3){await new Promise(z=>setTimeout(z,15000));
      try{const m=await j("data/meta.json");if(m.generated_at!==before){await loadAll();route();setStatus(`更新完成：${fmt.t(m.generated_at)}`);return}}catch(e){}
      try{const rr=await fetch(`https://api.github.com/repos/${repo}/actions/runs?event=workflow_dispatch&per_page=1`,{headers:H}).then(x=>x.json());
        const run=rr.workflow_runs&&rr.workflow_runs[0];if(run){if(run.status==="completed"&&run.conclusion!=="success"){setStatus(`更新失敗（${esc(run.conclusion)}）。<a href="${run.html_url}" target="_blank" rel="noopener">查看執行紀錄</a>`);return}
          setStatus(`GitHub 執行中：${esc(run.status==="completed"?"已完成，等待網站部署":run.status)}… <a href="${run.html_url}" target="_blank" rel="noopener">查看</a>`)}}catch(e){}}
    setStatus("等候逾時，請稍後重新整理頁面。");
  }catch(e){setStatus(`無法觸發更新：${esc(e.message)}。也可以按「到 GitHub 手動執行」。`)}
});

// ---------------------------------------------------------------- boot
loadAll().then(route).catch(e=>{$("#view").innerHTML=`<div class="empty">找不到資料檔（${esc(e.message)}）。部署後第一次排程執行完才會有資料。</div>`});
</script>
